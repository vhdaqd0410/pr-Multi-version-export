<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
  <title>多版本导出</title>
  <style>
    :root {
      --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d30;
      --fg: #e6e6e6; --dim: #9a9a9a; --accent: #4f8cff;
      --ok: #4caf50; --err: #f66; --border: #3a3a3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 13px/1.5 "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg);
      padding: 12px; user-select: none;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header .ver { color: var(--dim); font-size: 11px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: 0 0 auto; }
    .dot.on { background: var(--ok); }
    .dot.busy { background: #ff9800; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* 分组卡片 */
    .group {
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg2); padding: 10px; margin-bottom: 10px;
    }
    .group-title {
      font-size: 11px; color: var(--dim); margin-bottom: 7px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .seq-list { max-height: 110px; overflow-y: auto; }
    .seq-item { display: flex; align-items: center; gap: 8px; padding: 3px 4px; cursor: pointer; border-radius: 4px; }
    .seq-item:hover { background: var(--bg3); }
    .seq-item input { width: auto; }

    .mini-btns { display: flex; gap: 8px; margin-top: 6px; }
    .mini-btns button {
      font-size: 11px; padding: 3px 10px; border: 1px solid var(--border);
      border-radius: 4px; background: var(--bg3); color: var(--dim); cursor: pointer;
    }
    .mini-btns button:hover { color: var(--fg); }

    /* 版本卡片 */
    .ver-card {
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); padding: 9px; margin-bottom: 8px;
    }
    .ver-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .ver-head .v-enabled { width: auto; flex: 0 0 auto; margin: 0; }
    .ver-head .v-name { flex: 1; }
    .ver-card input[type=text], .ver-card select {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 5px; background: var(--bg2); color: var(--fg);
      font-size: 12px; outline: none;
    }
    .ver-card input:focus, .ver-card select:focus { border-color: var(--accent); }
    .ver-card .flabel { display: block; font-size: 11px; color: var(--dim); margin: 6px 0 2px; }
    /* 输出目录、保留音轨等独立 label */
    .ver-card > label { display: block; font-size: 11px; color: var(--dim); margin: 6px 0 2px; }
    .v-del {
      flex: 0 0 auto; padding: 0 9px; border: 1px solid var(--border);
      border-radius: 5px; background: var(--bg3); color: var(--err); cursor: pointer;
      font-size: 11px;
    }
    .v-del:hover { background: #3a1f1f; }

    /* 预设 + 音轨模式 两列并排 */
    .ver-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
    .ver-cols .col { min-width: 0; }
    .ver-cols label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 2px; }

    .dir-row { display: flex; gap: 8px; margin-top: 2px; }
    .dir-row input { flex: 1; }
    .dir-row button {
      flex: 0 0 auto; padding: 0 12px; border: 1px solid var(--border);
      border-radius: 5px; background: var(--bg3); color: var(--fg); cursor: pointer;
    }
    .dir-row button:hover { background: #3a3a3e; }

    .keep-list {
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg2); max-height: 90px; overflow-y: auto; padding: 4px;
      display: flex; flex-wrap: wrap; gap: 4px 12px;
    }
    .track-item { display: flex; align-items: center; gap: 5px; padding: 1px 4px; cursor: pointer; border-radius: 4px; font-size: 12px; }
    .track-item:hover { background: var(--bg3); }
    .track-item input { width: auto; }
    .keep-empty { color: var(--dim); font-size: 11px; padding: 3px; }

    .btn-add {
      width: 100%; padding: 7px; border: 1px dashed var(--border);
      border-radius: 6px; background: transparent; color: var(--dim);
      cursor: pointer; font-size: 12px;
    }
    .btn-add:hover { color: var(--accent); border-color: var(--accent); }

    .btns { display: flex; gap: 8px; margin: 10px 0; }
    #btn-go { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; background: var(--accent); }
    #btn-go:disabled { background: #555; cursor: not-allowed; }
    #btn-stop { flex: 0 0 auto; padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; color: #fff; background: #b33939; }
    #btn-stop:disabled { background: #555; cursor: not-allowed; }
    #btn-refresh { flex: 0 0 auto; padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; color: #fff; background: var(--bg3); }
    #btn-refresh:hover { background: #3a3a3e; }

    .progress-area { margin-bottom: 10px; display: none; }
    .progress-bar {
      height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden;
    }
    .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 5px; font-size: 11px; color: var(--dim);
    }
    .progress-pct { color: var(--fg); font-weight: 600; }

    .log {
      background: #141414; border: 1px solid var(--border);
      border-radius: 6px; padding: 9px; height: 140px;
      overflow-y: auto; font: 12px/1.6 Consolas, monospace;
      white-space: pre-wrap; word-break: break-all;
    }
    .log-line { color: var(--dim); }
    .log-line.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="header">
    <span class="dot" id="status-dot"></span>
    <h1>多版本交付导出</h1>
    <span class="ver" id="version"></span>
  </div>

  <div class="group">
    <div class="group-title"><span>序列</span><span>勾选要导出的（支持多选）</span></div>
    <div class="seq-list" id="seq-list"></div>
    <div class="mini-btns">
      <button id="btn-sel-all">全选</button>
      <button id="btn-sel-none">全不选</button>
    </div>
  </div>

  <div class="group">
    <div class="group-title"><span>交付版本</span><span>勾选「启用」才参与导出</span></div>
    <div id="versions-wrap"></div>
    <button id="btn-add-version" class="btn-add">＋ 添加版本</button>
  </div>

  <div class="progress-area" id="progress-area">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-meta">
      <span id="progress-state"></span>
      <span id="progress-time"></span>
      <span class="progress-pct" id="progress-pct"></span>
    </div>
  </div>

  <div class="btns">
    <button id="btn-go">一键导出</button>
    <button id="btn-stop" disabled>停止</button>
    <button id="btn-refresh">刷新</button>
  </div>

  <div class="log" id="log"></div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
